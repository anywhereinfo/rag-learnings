        type: string
        format: uuid
    ETag:
      description: The ETag for this version of the resource, used for caching and concurrency control.
      schema:
        type: string
        example: '"v2-a1b2c3d4"'
    IfMatch:
      name: if-match
      in: header
      required: true
      description: The ETag of the resource to update, used for optimistic concurrency control.
      schema:
        type: string
        example: '"v1-a1b2c3d4"'
    Location:
      description: The canonical URI of a newly created resource or an operation status resource.
      schema:
        type: string
        format: uri
    RetryAfter:
      description: The number of seconds to wait before retrying the request.
      schema:
        type: integer

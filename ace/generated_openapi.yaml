  responses:
    BadRequest:
      description: '400 Bad Request: The server cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: '401 Unauthorized: The request has not been applied because it lacks valid authentication credentials for the target resource.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: '403 Forbidden: The server understood the request but refuses to authorize it. The user may be authenticated but lacks permissions.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: '404 Not Found: The server has not found anything matching the Request-URI.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: '409 Conflict: The request could not be completed due to a conflict with the current state of the target resource (e.g., idempotency key mismatch, resource locked).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: '412 Precondition Failed: The server does not meet one of the preconditions that the requester put on the request header fields (e.g., If-Match ETag mismatch).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: '422 Unprocessable Entity: The server understands the content type of the request entity, and the syntax of the request entity is correct, but it was unable to process the contained instructions.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: '429 Too Many Requests: The user has sent too many requests in a given amount of time ("rate limiting").'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: '500 Internal Server Error: The server encountered an unexpected condition that prevented it from fulfilling the request.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

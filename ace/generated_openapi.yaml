      description: The maximum number of items to return per page.
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    Offset:
      name: offset
      in: query
      description: The starting position of the query for pagination.
      schema:
        type: integer
        default: 0
        minimum: 0
    AddressFamily:
      name: address_family
